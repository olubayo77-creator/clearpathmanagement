<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Stripe Sandbox Test</title></head>
<body style="font-family:system-ui;max-width:680px;margin:10vh auto;padding:24px">
<h1>Gentleman Strategist sandbox checkout</h1>
<p>This private preview starts a Stripe test checkout. No real payment will be processed.</p>
<button id="start" style="padding:14px 20px;font-size:16px">Start $29 sandbox checkout</button>
<p id="status" role="status"></p>
<script>
document.getElementById('start').addEventListener('click',async()=>{
 const button=document.getElementById('start'),status=document.getElementById('status');
 button.disabled=true; status.textContent='Opening secure Stripe checkout…';
 try {
  const response=await fetch('/api/checkout',{method:'POST',headers:{accept:'application/json'}});
  const data=await response.json();
  if(!response.ok||!data.url) throw new Error(data.error||'Checkout unavailable');
  location.href=data.url;
 } catch(error) {
  status.textContent=error.message; button.disabled=false;
 }
});
</script>
</body></html>
